title: Deploio
url: https://deplo.io
baseurl: ''
destination: _site
permalink: pretty
encoding: utf-8

collections:
  pages:
    output: false

defaults:
  - scope:
      path: ''
      type: pages
    values:
      lang: de
      excerpt_separator: ''

exclude:
  - bin
  - node_modules
  - package.json
  - package-lock.json
  - tailwind.config.js
  - project.toml
  - README.md
  - Gemfile
  - Gemfile.lock
  - scripts
  - vendor
