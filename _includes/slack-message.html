<section class="flex flex-col rounded-lg bg-white p-4 font-slack text-black lg:flex-row" data-appear data-delay="{{ include.delay }}"><div class="pr-3"><img src="/assets/images/avatars/{{ include.avatar }}" alt="{{ include.name_key | t }}" class="h-12 w-12 rounded-xl"></div><div class="flex-1 font-normal"><div><span class="mr-1 whitespace-pre font-black">{{ include.name_key | t }}</span><span class="text-gray-600">{{ include.date_key | t }}</span></div>{% assign message = include.text_key | t %}{% if include.link_nine %}{% assign message = message | replace: 'nine.ch', '<a href="https://nine.ch" class="text-blue-600">nine.ch</a>' %}{% endif %}<p class="mt-0 pt-0">{{ message }}</p></div></section>
