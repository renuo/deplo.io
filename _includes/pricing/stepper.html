<div class="pricing-stepper {{ include.class }}" data-stepper data-active="false">
  <button
    type="button"
    class="pricing-step"
    {{ include.attributes }}
    data-delta="-1"
    aria-label="{% t pricing_calc_decrease %}"
  >
    <img
      class="size-6"
      src="/assets/images/icons/pricing/remove-dark.svg"
      alt=""
      width="24"
      height="24"
      data-stepper-icon="idle"
    >
    <img
      class="size-6"
      src="/assets/images/icons/pricing/remove.svg"
      alt=""
      width="24"
      height="24"
      data-stepper-icon="active"
    >
  </button>
  <span class="pricing-stepper-value" {{ include.value_attribute }} aria-live="polite">0</span>
  <button
    type="button"
    class="pricing-step"
    {{ include.attributes }}
    data-delta="1"
    aria-label="{% t pricing_calc_increase %}"
  >
    <img
      class="size-6"
      src="/assets/images/icons/pricing/add-dark.svg"
      alt=""
      width="24"
      height="24"
      data-stepper-icon="idle"
    >
    <img
      class="size-6"
      src="/assets/images/icons/pricing/add.svg"
      alt=""
      width="24"
      height="24"
      data-stepper-icon="active"
    >
  </button>
</div>
