<div class="flex items-center {{ include.class }}">
  <button
    type="button"
    class="pricing-step"
    {{ include.attributes }}
    data-delta="-1"
    aria-label="{% t pricing_calc_decrease %}"
  >
    <img class="size-6" src="/assets/images/icons/pricing/remove.svg" alt="" width="24" height="24">
  </button>
  <span
    class="flex h-10 min-w-0 flex-1 items-center justify-center border-y border-deploio/30 bg-white px-3 font-semibold text-deploio"
    {{ include.value_attribute }}
    aria-live="polite"
    >0</span
  >
  <button
    type="button"
    class="pricing-step"
    {{ include.attributes }}
    data-delta="1"
    aria-label="{% t pricing_calc_increase %}"
  >
    <img class="size-6" src="/assets/images/icons/pricing/add.svg" alt="" width="24" height="24">
  </button>
</div>
