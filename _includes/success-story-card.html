<a
  href='{{ include.href }}'
  class='relative z-10 flex w-full min-w-[80vw] flex-col items-stretch border-t-2 border-deploio bg-white text-deploio shadow-card transition-all hover:scale-105 sm:min-w-0 sm:flex-row'
>
  <div class='z-10 order-1 flex-1 pb-7 pl-6 pr-6 pt-7 max-sm:mt-32 sm:order-first sm:pr-0 md:pl-6 md:pr-4'>
    <h3 class='uppercase'>{{ include.subtitle_key | t }}</h3>
    <h2
      class='text-h2 mb-5 mt-0 max-sm:text-2xl max-sm:font-normal sm:whitespace-nowrap md:mt-0'
      data-appear
      data-delay='50'
    >
      {{ include.title_key | t }}
    </h2>
    <p class='mb-8 text-[20px]' data-appear data-delay='100'>
      {{ include.description_key | t }}
    </p>
    <span
      class='flex whitespace-nowrap font-medium text-deploio'
      data-appear
      data-delay='150'
    >
      {% t feature_why_button %}
      <img src='/assets/images/icons/chevron.svg' alt='chevron'>
    </span>
  </div>
  <div class='flex-1'>
    <div class='absolute h-1/3 w-full sm:right-0 sm:h-full sm:w-1/2'>
      <img
        src='/assets/images/backgrounds/{{ include.image }}'
        alt='Deploio success story'
        loading='lazy'
        class='h-full w-full object-cover object-top'
      >
    </div>
    <div
      class='absolute block h-1/3 w-full bg-gradient-to-t from-white to-transparent sm:hidden'
    ></div>
    <div
      class='absolute top-0 hidden h-full bg-gradient-to-r from-white to-transparent sm:right-0 sm:block sm:w-1/2'
    ></div>
  </div>
</a>
