<main>
  <div class="relative h-[600px]">
    <div class="pointer-events-none absolute h-full w-full select-none"><video aria-hidden="true" class="pointer-events-none absolute h-full min-w-full object-cover object-top" autoplay muted loop playsinline><source src="/assets/images/backgrounds/deploio_video.mp4" type="video/mp4"></video><div class="relative h-full w-full bg-gradient-to-t from-background via-80% to-transparent">&nbsp;</div></div>
    <section class="container relative flex h-full flex-col justify-end space-y-6 pb-16 text-deploio"><h1 class="max-w-[500px] text-5xl text-[46px] font-medium uppercase leading-[50px]" data-appear>{% t pricing_title %}</h1><p class="max-w-[500px] text-lg" data-appear data-delay="100">{% t pricing_description %}</p></section>
  </div>
  <div class="bg-background"><div class="container !pb-32 !pt-0"><iframe width="100%" height="787" title="pricing" allow="clipboard-read; clipboard-write" src="{{ site.pricing_calculator_url }}/?lang={{ page.lang }}&amp;linkbase={{ site.url | url_encode }}%2F{% unless page.lang == 'de' %}{{ page.lang }}%2F{% endunless %}pricing%2F&amp;embed=true" data-appear data-delay="200"></iframe></div></div>
  {% include register.html %}
</main>
