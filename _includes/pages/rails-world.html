<main>
  <div class='relative h-[100svh]'>
    <div class='pointer-events-none absolute h-full w-full select-none'>
      <img
        aria-hidden='true'
        loading='lazy'
        class='absolute h-full min-w-full object-cover object-top'
        src='/assets/images/backgrounds/mountain_1.webp'
        alt=''
      >
      <div class='relative h-full w-full bg-gradient-to-t from-deploio to-hero/40'>&nbsp;</div>
    </div>
    <div class='relative h-full'>
      <div class='container relative flex h-full flex-col items-center pb-12 text-center text-white sm:pb-16'>
        <div class='mx-auto w-full max-w-3xl space-y-3 pt-10'>
          <h1 class='text-2xl font-medium leading-tight sm:text-3xl md:text-4xl'>
            Sorry... you did not win this time.
          </h1>
          <p class='text-base text-white/90 sm:text-lg'>But here is a video of our CEO.</p>
        </div>
        <div class='flex min-h-0 w-full flex-1 items-center justify-center py-8'>
          <video
            src='/videos/rails-world-2026-ceo.mp4'
            controls
            playsinline
            autoplay
            class='h-full max-h-[55vh] max-w-full rounded-lg object-contain'
          >
            <track kind='captions'>
          </video>
        </div>
        <div>{% include button.html variant='primary' href='/en/' text='To Deploio' %}</div>
      </div>
    </div>
  </div>
</main>
