<section id='register' class='bg-mountain text-center text-deploio'>
  <div class='overflow-x-hidden bg-background'>
    <div class='container relative z-10 !py-0 text-left lg:absolute lg:left-1/2 lg:-translate-x-1/2 lg:py-4'>
      <h2 class='text-h2 max-w-[800px]' data-appear>{% t complex_projects %}</h2>
      <p class='max-w-[620px] pb-2 pt-8' data-appear data-delay='100'>{% t complex_projects_description %}</p>
      <div class='flex justify-start'>
        <a href='{% t nine_url %}' target='_blank' class='text-p flex items-center font-medium'>
          {%- t nine -%}
          <img src='/assets/images/icons/call_made.svg' class='ml-2 h-5 w-5' alt='External link'
        ></a>
      </div>
    </div>
    <div class='relative w-full overflow-hidden'>{% include mountain.html %}</div>
  </div>
  <div class='container bg-mountain !pb-0'>
    <div class='flex flex-col items-center justify-center'>
      <h2 class='text-h2 pb-8'>{% t complex_projects_ready %}</h2>
      <div class='flex' data-appear data-delay='150'>
        {%
          include button.html
          variant='secondary'
          cockpit_path='/fast_onboardings/new?origin=deploio'
          text_key='complex_projects_button'
        %}
      </div>
    </div>
  </div>
  <section class='relative overflow-x-hidden bg-mountain pb-28 pt-28 md:pb-12'>
    <div class='container relative z-10'>
      <div
        class='absolute inset-0 select-none font-mono'
        data-binary
        data-icon-push='/assets/images/icons/1free_push.svg'
        data-icon-risk='/assets/images/icons/0risk_{% if page.lang == 'de' %}de{% else %}en{% endif %}.svg'
        data-icon-control='/assets/images/icons/100control_{% if page.lang == 'de' %}de{% else %}en{% endif %}.svg'
      ></div>
    </div>
  </section>
</section>
