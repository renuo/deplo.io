  team_title: Il nostro team
  team_description: Sviluppiamo Deploio – una piattaforma per applicazioni completamente gestita dalla Svizzera. Il nostro team combina competenze in sviluppo, operazioni e sicurezza per trasformare i repository Git in applicazioni in modo fluido.
  success_story_subtitle: COME È INIZIATO TUTTO
  success_story_title: HOSTING SENZA STORIE
  success_story_description: Renuo AG voleva un hosting cloud senza complicazioni. Con Deploio hanno trovato la perfetta alternativa svizzera a Heroku – semplice, sovrana, senza grattacapi.
  success_story_long_description: "Renuo AG è una società svizzera di ingegneria del software con una missione: scrivere ottimo codice – preferibilmente in Ruby on Rails – senza doversi occupare dell'amministrazione dei server. Per anni tutto è andato tramite Heroku, finché un singolo messaggio Slack ha dato il via a tutto. In questa success story vi raccontiamo come Renuo ha trovato il partner perfetto per l'hosting cloud in Svizzera – e perché Deploio è ora il numero uno indiscusso per loro."
  success_story_before_cloud_title: IL TEMPO PRIMA DEL CLOUD
  success_story_before_cloud_text: 'Deploio è gestito da Nine e noi eravamo già clienti Nine in precedenza. Era prima del cloud. Abbiamo configurato e gestito server per i nostri clienti. Questo costava molto tempo e nervi: acquistare certificati SSL, gestire accessi SSH, monitorare lo spazio su disco, aggiornare le librerie di sistema. Poi è arrivato Heroku. Ci ha liberati dall''amministrazione dei server. Abbiamo potuto concentrarci sullo sviluppo software, anche senza vendor lock-in grazie a 12factor. Semplicemente "git push", CI/CD e il cliente può testare. Così siamo migrati nel cloud.'
  success_story_beauty_and_the_beast_title: LA BELLA E LA BESTIA
  success_story_beauty_and_the_beast_text: Renuo è un'azienda svizzera a conduzione familiare. Ma Heroku è americano e gira su AWS. Questo ci ha sempre dato fastidio per i successivi dieci anni. Deve essere possibile usare un prodotto così figo come Heroku in Svizzera, dove posso anche bussare alla porta di qualcuno se qualcosa non mi piace – buona fortuna a farlo con Salesforce. Eravamo nel contratto Enterprise; semplicemente un vero incubo. Ed è stato Deploio ad arrivare in soccorso, al momento giusto!
  success_story_note_title: Noi scriviamo codice, Deploio fa il resto
  success_story_note_text: "Siamo nel business del software, non dell'infrastruttura. Non voglio gestire Kubernetes da solo né server bare-metal (come separo i clienti? chi fa veramente gli aggiornamenti del kernel?). Sviluppiamo buon codice, questo deve bastare: 'git push', CI/CD e il cliente può testare. L'infrastruttura la gestisce Deploio, in Svizzera, e lo fanno bene. Non ho mai avuto bisogno di bussare alla loro porta di Stauffacher Platz."
  success_story_slack_message_1_name: Samuel Steiner  ·  Renuo AG
  success_story_slack_message_1_date: 23 set 2022 alle 23:42
  success_story_slack_message_1_text: Ciao a tutti. C'è qualcuno che ospita principalmente con Heroku e non è soddisfatto delle modifiche recentemente annunciate? Sarebbe una buona opportunità per creare qualcosa di nostro. Attendo messaggi privati.
  success_story_slack_message_2_name: Thomas Hug
  success_story_slack_message_2_date: 24 set 2022 alle 14:15
  success_story_slack_message_2_text: Ciao Samuel<br />Non usiamo Heroku noi stessi, ma abbiamo molta infrastruttura propria, una piattaforma Kubernetes nel nostro datacenter e una piattaforma basata su Kubernetes Engine di Google su Google Cloud.<br />Cosa volete fare esattamente? Cosa non vi piace di Heroku?<br />Forse dovremmo parlare?<br />Cordiali saluti<br />Tom<br />Oh... noi/io = nine.ch
  success_story_note_quote: Cloud sì, ma preferibilmente in Svizzera da un'azienda svizzera con ingegneri capaci, non solo rivenditori Amazon.
  success_story_demokratis_subtitle: SWISSNESS
  success_story_demokratis_title: FACCIAMO DEMOCRAZIA
  success_story_demokratis_description: 'Demokratis vuole digitalizzare la politica svizzera. In Deploio ha trovato un partner locale: sicuro, affidabile e senza complicazioni.'
  success_story_demokratis_long_description: Portare la politica svizzera nell'era digitale non è una passeggiata. Soprattutto se i clienti principali sono cantoni e autorità pubbliche. Perché quando si tratta di dati sensibili e di localizzazione dei server, non si scherza. In questa Success Story raccontiamo come la piattaforma indipendente Demokratis abbia trovato la perfetta soluzione cloud svizzera con Deploio – e perché fa un'enorme differenza avere un partner che offre un aiuto flessibile proprio lì dove serve di più.
  success_story_demokratis_public_hand_title: LA SFIADA CON IL SETTORE PUBBLICO
  success_story_demokratis_public_hand_text: "Per i clienti e i partner di Demokratis, che provengono principalmente dal settore pubblico (come i cantoni), la localizzazione dei dati è assolutamente essenziale. Una soluzione all'estero?<br>Per questi processi statali è semplicemente fuori discussione.<br><br>A ciò si è aggiunto un vero e proprio grattacapo tecnico: i primi cantoni utilizzano l'applicazione Demokratis sotto il proprio dominio. Per fare questo, è stato necessario configurare record CNAME che reindirizzassero in modo fluido alla piattaforma di Demokratis. Per la migrazione occorreva quindi un partner in grado di gestire questo specifico routing di dominio in modo affidabile."
  success_story_demokratis_swissness_title: LA SWISSNESS COME FATTORE DECISIVO
  success_story_demokratis_swissness_text: 'La soluzione? "Demokratis powered by Deploio". Il passaggio è stato il passo logico per soddisfare i severi requisiti delle autorità. Il motivo principale del trasferimento era evidente: l''intera infrastruttura si trova in Svizzera ed è fornita e gestita da Deploio. Questo garantisce ai cantoni la sicurezza e la fiducia necessarie.'
  success_story_demokratis_note_title: UN SUPPORTO CHE ANTICIPA I BISOGNI
  success_story_demokratis_note_text: Non siamo dei tecnici puri. Ecco perché l'installazione completa del cloud e la migrazione della nostra piattaforma ci hanno fatto sudare un po'. Ma invece di sistemi di ticket anonimi, abbiamo ricevuto un supporto super flessibile direttamente tramite Slack ed e-mail personali. Avevamo bisogno di alcune funzioni speciali per il routing – e il team di Deploio ce le ha fornite rapidamente e senza problemi. È davvero fantastico essere così vicini al prodotto.<br><br>In più, ora disponiamo di deployment moderni. Distribuzione di una feature branch tramite nctl come app di staging, test ed è fatta. Ci concentriamo interamente sulla nostra missione per rendere le consultazioni pubbliche più inclusive. Deploio si occupa dell'infrastruttura, in modo sicuro e interamente in Svizzera. E lo fanno davvero bene.
  success_story_demokratis_quote_name: Fabian Ligibel
  success_story_demokratis_quote_text: La nostra missione è la democrazia digitale, non la gestione dei server. Grazie alla soluzione PaaS di Deploio, non dobbiamo preoccuparci minimamente dell’infrastruttura.
  success_story_demokratis_quote_role: Strategia e prodotto Demokratis
