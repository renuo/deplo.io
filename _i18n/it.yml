  feature_1_description: Perché preoccuparsi di Kubernetes o dei livelli OSI? Deploio è la tua soluzione PaaS dalla Svizzera che ti copre le spalle. Tu sviluppi, noi ci occupiamo di build, release, TLS, backup e altro ancora. Da Ruby al Dockerfile – la tecnologia sotto il tuo controllo.
  feature_2_title: Platform-as-a-Service
  feature_2_description: Deploio rende il deployment delle app semplice. La nostra piattaforma ti offre deployment rapido, gestione scalabile e archiviazione dei dati – in sicurezza in Svizzera. Fino a dieci volte più veloce in dyno, per far brillare le tue applicazioni.
  feature_3_title: Certezza giuridica
  feature_3_description: Con Deploio, i tuoi dati non sono solo archiviati al 100% in Svizzera, ma sono anche al 100% soggetti al diritto svizzero. La NSA non ha accesso.
